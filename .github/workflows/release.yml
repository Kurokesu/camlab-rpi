name: Release

# Durable publish on a debian/ tag push: verify the paired source
# tag, build against it, sign, upload onto the existing v-tag release
# next to the source tarball. Detached from Kurokesu/ci while app
# packaging stabilizes. Preflight and sign are ports of
# dkms-release.yml and deb-sign.yml, kept contract-identical so apt
# archive ingest sees identical assets. See
# debian/source/README.source for the release procedure.

on:
  push:
    tags: ['debian/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  preflight:
    name: Verify paired source tag
    runs-on: ubuntu-latest
    outputs:
      packaging-version: ${{ steps.parse.outputs.packaging }}
      upstream-ref: ${{ steps.parse.outputs.ref }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Parse packaging tag
        id: parse
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/debian/*) ;;
            *) echo "::error::Not a debian/* tag push: ${GITHUB_REF}."; exit 1 ;;
          esac
          RAW="${GITHUB_REF#refs/tags/debian/}"
          # Epoch-free upstream-revision shape, pre-release grammar
          # limited to where dpkg and semver ordering agree. '_' stands
          # in for Debian '~', which is illegal in git refs (DEP-14).
          printf '%s' "$RAW" | grep -Eq '^[0-9]+(\.[0-9]+)*(_(alpha|beta|rc)\.[0-9]+)?-[0-9]+$' || {
            echo "::error::Tag 'debian/${RAW}' is not debian/X.Y.Z[_(alpha|beta|rc).N]-<rev>."
            exit 1
          }
          PACKAGING=$(printf '%s' "$RAW" | sed 's/_/~/g')
          UPSTREAM="${PACKAGING%-*}"
          # Source tags carry the semver form: '~' back to '-'.
          UPSTREAM_REF="v$(printf '%s' "$UPSTREAM" | sed 's/~/-/g')"
          echo "packaging=${PACKAGING}" >> "$GITHUB_OUTPUT"
          echo "upstream=${UPSTREAM}" >> "$GITHUB_OUTPUT"
          echo "ref=${UPSTREAM_REF}" >> "$GITHUB_OUTPUT"
          echo "Packaging tag : debian/${PACKAGING}"
          echo "Upstream ref  : ${UPSTREAM_REF}"

      - name: Verify source tag exists (fail fast)
        # Tag names are outside input. env keeps them out of the script text.
        env:
          REF: ${{ steps.parse.outputs.ref }}
        run: |
          set -euo pipefail
          if ! git rev-parse "refs/tags/${REF}" >/dev/null 2>&1; then
            echo "::error::Source tag '${REF}' does not exist on this repo."
            echo "::error::Cut the source release first (RELEASING.md on main),"
            echo "::error::then re-push the packaging tag to trigger this workflow."
            exit 1
          fi
          echo "OK: source tag ${REF} -> $(git rev-parse "refs/tags/${REF}")"

      - name: Verify tags sit on their branches
        # A tag on a stray commit must not release. The fetch-depth 0
        # checkout above brings all branch heads.
        env:
          REF: ${{ steps.parse.outputs.ref }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/debian/latest || {
            echo "::error::Tagged commit $(git rev-parse HEAD) is not on debian/latest."
            exit 1
          }
          SRC=$(git rev-parse "refs/tags/${REF}^{commit}")
          git merge-base --is-ancestor "$SRC" origin/main || {
            echo "::error::Source tag ${REF} (${SRC}) is not on main."
            exit 1
          }
          echo "OK: packaging tag on debian/latest, ${REF} on main."

      - name: Verify tag matches debian/changelog
        # Guards hand-made tags. The checkout on a tag push is the tagged commit.
        env:
          TAG: ${{ steps.parse.outputs.packaging }}
        run: |
          set -euo pipefail
          command -v dpkg-parsechangelog >/dev/null \
            || sudo apt-get install -y --no-install-recommends dpkg-dev
          CHANGELOG=$(dpkg-parsechangelog -SVersion)
          # The packaging tag is epoch-free (colons are illegal in git refs),
          # so compare against the changelog version with any epoch stripped.
          CHANGELOG_TAG=${CHANGELOG#*:}
          if [ "${CHANGELOG_TAG}" != "${TAG}" ]; then
            echo "::error::Packaging tag says '${TAG}' but debian/changelog at the tagged commit says '${CHANGELOG}'."
            echo "::error::Retag the commit with a matching changelog."
            exit 1
          fi
          echo "OK: tag matches changelog (${CHANGELOG})"

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      upstream-ref: ${{ needs.preflight.outputs.upstream-ref }}

  sign:
    name: Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Download by explicit name into an explicit directory. A bare
      # download-all flattens a single artifact into the path itself,
      # which breaks the per-artifact glob below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts/${{ needs.build.outputs.artifact }}

      - name: Bundle assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          for dir in artifacts/*/; do
            # GitHub sanitizes release asset names, turning '~' into
            # '.', so mangle it to '_' like the packaging tag. Renaming
            # here keeps SHA256SUMS recording the published names.
            name=$(basename "$dir" | tr '~' '_')
            ( cd "$dir"
              files=( *.deb *.changes *.buildinfo )
              keep=()
              for f in "${files[@]}"; do
                [[ $f == *dbgsym* ]] || keep+=("$f")
              done
              [ "${#keep[@]}" -gt 0 ] \
                || { echo "::error::Nothing to bundle for ${name}."; exit 1; }
              tar -czf "${GITHUB_WORKSPACE}/release-assets/${name}.tar.gz" \
                -- "${keep[@]}"
            )
          done
          cd release-assets
          # Guard the glob: unmatched would make sha256sum read stdin.
          tarballs=( *.tar.gz )
          [ "${#tarballs[@]}" -gt 0 ] \
            || { echo "::error::No tarballs produced."; exit 1; }
          sha256sum -- "${tarballs[@]}" > SHA256SUMS
          ls -la

      - name: Sign SHA256SUMS
        env:
          ARCHIVE_GPG_SIGNING_KEY: ${{ secrets.ARCHIVE_GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          GNUPGHOME=$(mktemp -d); export GNUPGHOME
          trap 'gpgconf --kill all 2>/dev/null || true; rm -rf "$GNUPGHOME"' EXIT

          # || true: an empty/garbage secret falls through to the
          # actionable assertion below instead of a bare gpg error.
          printf '%s' "$ARCHIVE_GPG_SIGNING_KEY" \
            | gpg --batch --quiet --no-greeting --import || true

          # || KEYIDS="" keeps the error below reachable under pipefail
          # when the import yielded no secret keys.
          KEYIDS=$(gpg --list-secret-keys --with-colons 2>/dev/null \
            | awk -F: '$1=="ssb" && $12~/s/ {print $5}') || KEYIDS=""
          [ -n "$KEYIDS" ] && [ "$(printf '%s\n' "$KEYIDS" | wc -l)" -eq 1 ] \
            || { echo "::error::Expected exactly one signing subkey; found: ${KEYIDS:-none}."; exit 1; }

          cd release-assets
          gpg --batch --yes --quiet --pinentry-mode loopback \
            --no-auto-key-locate --keyserver-options no-auto-key-retrieve \
            --local-user "$KEYIDS" \
            --detach-sign --armor SHA256SUMS

          # Independent check against the published archive keyring,
          # the same key installed boxes pin.
          curl -fsSL https://apt.kurokesu.com/kurokesu-archive-keyring.gpg \
            -o "${GITHUB_WORKSPACE}/kurokesu-archive-keyring.gpg"
          gpgv --keyring "${GITHUB_WORKSPACE}/kurokesu-archive-keyring.gpg" \
            SHA256SUMS.asc SHA256SUMS

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub release
    needs: [preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets/

      - name: Upload assets onto the source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.upstream-ref }}
        run: |
          set -euo pipefail

          # The v-tag release carries the README-pinned source tarball,
          # so this step never creates or deletes a release and never
          # touches flags or notes.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No GitHub release at ${TAG}."
            echo "::error::Cut the source release first (RELEASING.md on main), then re-run."
            exit 1
          fi

          # Delete only assets this workflow owns: signed checksums and
          # deb bundles. A packaging rebuild (-1 to -2) must not leave
          # the old revision's bundle beside checksums that no longer
          # list it. Source tarball names (camlab-rpi-*.tar.gz) never
          # match these patterns.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > existing.txt
          grep -E '^SHA256SUMS|^camlab_.*\.tar\.gz$' existing.txt > owned.txt || true
          xargs -r -I{} gh release delete-asset "$TAG" {} --yes \
            --repo "$GITHUB_REPOSITORY" < owned.txt

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            --clobber release-assets/*
