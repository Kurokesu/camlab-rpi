name: CI

# Transient validation of the packaging recipe on every push and pull
# request to debian/latest. Builds against current app source on main.

on:
  push:
    branches: [debian/latest]
  pull_request:
    branches: [debian/latest]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upstream-ref: main
