name: CI

# Transient validation of the packaging recipe on every push and pull
# request to debian/latest. Builds against current app source on main.

on:
  push:
    branches: [debian/latest]
  pull_request:
    branches: [debian/latest]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Shellcheck
        # No xargs -r, an empty match must fail rather than pass silently
        run: git ls-files -z | xargs -0 awk 'FNR == 1 && /^#!.*sh/ { print FILENAME }' | xargs shellcheck

  build:
    uses: ./.github/workflows/build.yml
    with:
      upstream-ref: main
