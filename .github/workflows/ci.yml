name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Ruff
        run: |
          pip install ruff
          ruff check camlab tests deploy
          ruff format --check camlab tests deploy

      - name: Shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

      - name: REUSE lint
        uses: fsfe/reuse-action@v6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: Compile python
        run: python3 -m compileall -q camlab deploy

      - name: Parse registry yaml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('camlab/data/sensors.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('camlab/data/dsi_panels.yaml'))"

      - name: Pytest
        run: pytest
